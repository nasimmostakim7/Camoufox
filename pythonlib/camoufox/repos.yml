# Default configurations
default:
  browser: Official
  geoip: MaxMind GeoLite2

# Browser repositories
browsers:
  # The fork is primary: its releases are built from this tree, so they are the
  # only ones carrying the Juggler input-dispatch and fingerprint patches the
  # patch guards assert on. Upstream stays as the fallback for a version the
  # fork has not published yet, which is what lets a Firefox bump land here
  # before a fork build exists.
  #
  # The name stays `Official` on purpose. It is the default channel
  # (`official/stable`), and `get_repo_name()` derives the install directory
  # from it, so renaming would move every existing install and change what
  # `browsers/official/...` resolves to.
  - repo: nasimmostakim7/Camoufox, daijro/camoufox, camoufox/camoufox
    name: Official
    pattern: "{name}-{version}-{build}-{os}.{arch}.zip"
    versions:
      - python_library:
          min: "0.5.0"
          max: "1"
        browser:
          # Stable channel
          stable:
            min: "beta.19"
            max: "1"
          # Prerelease channel (including "alpha.*" builds) matches all versions

  - repo: coryking/camoufox
    name: CoryKing
    pattern: "{name}-{version}-{build}-{os}.{arch}.zip"
    versions:
      - python_library:
          min: "0.5.0"
          max: "1"
        # Assume all browsers

  - repo: JWriter20/camoufox
    name: JWriter20
    pattern: "{name}-{version}-{build}-{os}.{arch}.zip"
    versions:
      - python_library:
          min: "0.5.0"
          max: "1"
        # Assume all browsers

# GeoIP database repositories
geoip:
  # GeoLite2 City - Full city-level data with timezone
  - name: MaxMind GeoLite2
    urls:
      ipv4:
        - https://cdn.jsdelivr.net/npm/@ip-location-db/geolite2-city-mmdb/geolite2-city-ipv4.mmdb
        - https://raw.githubusercontent.com/sapics/ip-location-db/refs/heads/main/geolite2-city-mmdb/geolite2-city-ipv4.mmdb
      ipv6:
        - https://cdn.jsdelivr.net/npm/@ip-location-db/geolite2-city-mmdb/geolite2-city-ipv6.mmdb
        - https://raw.githubusercontent.com/sapics/ip-location-db/refs/heads/main/geolite2-city-mmdb/geolite2-city-ipv6.mmdb
    paths:
      iso_code: country_code
      longitude: longitude
      latitude: latitude
      timezone: timezone

  # GeoIP All-in-One - Combined IPv4/IPv6 with all fields
  - name: GeoIP AIO by daijro
    extract: true
    urls:
      combined:
        - https://github.com/daijro/geoip-all-in-one/releases/latest/download/geoip-aio-all.mmdb.zip
    paths:
      iso_code: country.iso_code
      longitude: location.longitude
      latitude: location.latitude
      timezone: location.time_zone
