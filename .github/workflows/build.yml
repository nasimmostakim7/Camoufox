name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [linux, windows, macos]
        arch: [x86_64, arm64, i686]
        exclude:
          # Fails (.mozbuild does not include clang++-cl)
          - target: windows
            arch: arm64
          # Unsupported
          - target: macos
            arch: i686
          - target: linux
            arch: i686

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL} mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          if [[ (${CODENAME} = focal) || (${CODENAME} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null
          fi
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18
          if [ "${{ matrix.arch }}" != "x86_64" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          # ccache: the mozconfig enables --with-ccache, but the runner image no
          # longer ships it, so configure fails with "Cannot find ccache".
          sudo apt-get install -y msitools p7zip-full aria2 ccache

      - name: Resolve the pinned browser version
        id: pinned
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' upstream.sh)"
          [ -n "$version" ] || { echo "::error::upstream.sh has no version= line"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore ccache
        # The same key the CI build uses (tests.yml), and for the same reason: a
        # release cut right after a green CI run should start from a warm cache
        # instead of recompiling all of libxul. A cold build is over an hour and
        # is where a release run is most likely to die on a resource limit.
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ steps.pinned.outputs.version }}-${{ hashFiles('patches/**', 'additions/**', 'assets/*.mozconfig') }}
          restore-keys: |
            ccache-${{ steps.pinned.outputs.version }}-
            ccache-

      - name: Fetch source
        env:
          CAMOUFOX_PASSWD: ${{ secrets.CAMOUFOX_PASSWD }}
        run: |
          make fetch

      - name: Setup and bootstrap
        run: |
          make setup-minimal
          make mozbootstrap
          mkdir -p dist

      - name: Create swap space
        run: |
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Build
        env:
          # Cap Rust parallelism to lower peak memory (avoids OOM/SIGTERM).
          # Tune to taste: higher = faster but more RAM.
          CARGO_BUILD_JOBS: "1"
        run: python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    # Runs even if a platform in the matrix failed. CI only needs the
    # lin.x86_64 asset, and `needs: build` would otherwise let one flaky
    # cross-compile -- Windows or macOS, neither of which CI fetches -- block
    # the release that unblocks CI. The step below insists on lin.x86_64 before
    # publishing, so a run that did not build it still fails without releasing
    # anything; a partial release is published otherwise, and the fetcher falls
    # back to upstream on the platforms it is missing (see ci/README.md).
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'cancelled' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check the tag can be fetched
        # `pythonlib/camoufox/repos.yml` matches assets by name with the pattern
        # `{name}-{version}-{build}-{os}.{arch}.zip`, and reads the version and
        # build out of the TAG (`v152.0.4-beta.31` -> version 152.0.4, build
        # beta.31). A tag missing either part publishes a release that downloads
        # by hand and is invisible to `camoufox fetch`.
        #
        # The version must also stay on the Firefox generation `upstream.sh`
        # pins: the CI fetch path runs `ci.versions --check-fetched`, which
        # allows beta drift inside a generation, not a generation apart.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*-*)
              version="${tag#v}"; version="${version%%-*}"
              build="${tag#v}"; build="${build#*-}"
              ;;
            *)
              echo "::error::tag '$tag' is not v<version>-<build> (like v152.0.4-beta.31)."
              echo "::error::The fetcher reads version and build out of the tag; without"
              echo "::error::both parts it cannot match this release's assets."
              exit 1
              ;;
          esac

          pinned="$(sed -n 's/^version=//p' upstream.sh)"
          [ -n "$pinned" ] || { echo "::error::upstream.sh has no version= line"; exit 1; }
          if [ "$version" != "$pinned" ]; then
            echo "::error::tag says Firefox $version but upstream.sh pins $pinned."
            echo "::error::The CI fetch path checks the generation and would reject this"
            echo "::error::release. Bump upstream.sh first, or tag the pinned generation."
            exit 1
          fi

          # Every asset that is not named the expected way is silently skipped by
          # the fetcher, so the release would look published and install nothing.
          shopt -s nullglob
          assets=(artifacts/*/*.zip artifacts/*.zip)
          [ "${#assets[@]}" -gt 0 ] || { echo "::error::no .zip assets were built"; exit 1; }
          for asset in "${assets[@]}"; do
            file="$(basename "$asset")"
            case "$file" in
              camoufox-"$version"-"$build"-*.zip) ;;
              *)
                echo "::error::asset '$file' does not match"
                echo "::error::camoufox-$version-$build-<os>.<arch>.zip"
                exit 1
                ;;
            esac
          done

          # lin.x86_64 is the one asset CI fetches, and the release job tolerates a
          # failed platform in the matrix. Without this, a run that lost the Linux
          # job would publish a release that unblocks nothing, which is worse than
          # no release: the failure would resurface as "fetched an old browser and
          # the patch guards failed", far from the build that caused it.
          # Deliberately a loop rather than `... | grep -qx`: under `pipefail`,
          # grep exits at the first match, the writer upstream gets SIGPIPE, and
          # the pipeline reports failure on a SUCCESSFUL check. That is exactly
          # how the first release run died -- every platform had built, the
          # Linux asset was present, and the job still refused to publish.
          want="camoufox-$version-$build-lin.x86_64.zip"
          found=""
          for asset in "${assets[@]}"; do
            if [ "$(basename "$asset")" = "$want" ]; then found=1; break; fi
          done
          [ -n "$found" ] || { echo "::error::no $want was built,"; \
               echo "::error::and that is the asset CI fetches. Not releasing."; exit 1; }

          echo "tag $tag -> $version ($build), ${#assets[@]} assets"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          # Neither draft nor prerelease. A draft is invisible to the releases API
          # to anyone without a token, and the fetch path runs unauthenticated in
          # some workflows, so it would find nothing and fail the generation
          # check. `prerelease: true` would additionally drop the release out of
          # the `stable` channel, which is the one `official/stable` follows. The
          # beta in the tag already says what this is.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the release is visible without a token
        # Closed here rather than trusted: the fetch path is sometimes
        # unauthenticated, and a release it cannot see is one CI cannot test
        # against. This asks the anonymous endpoint the fetcher asks, then applies
        # the pattern the fetcher matches on.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"; version="${version%%-*}"
          build="${tag#v}"; build="${build#*-}"
          wanted="camoufox-$version-$build-lin.x86_64.zip"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$tag"

          for attempt in 1 2 3 4 5; do
            names="$(curl -sS -H 'Accept: application/vnd.github+json' "$api" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(a.get("name","") for a in d.get("assets",[])))' \
              2>/dev/null || true)"
            if printf '%s\n' "$names" | grep -qx "$wanted"; then
              echo "visible: $tag publishes $wanted"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::$tag is not visible to an unauthenticated release lookup,"
          echo "::error::or it has no $wanted asset. Either way 'camoufox fetch'"
          echo "::error::cannot install it."
          exit 1
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
